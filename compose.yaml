x-app-environment: &app-environment
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-eduflow}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-eduflow}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  UPLOAD_DIR: /srv/eduflow/uploads

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eduflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-eduflow}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build:
      context: .
      target: api
    env_file: .env
    environment: *app-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build:
      context: .
      target: api
    env_file: .env
    environment: *app-environment
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - audio_data:/srv/eduflow/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  worker:
    build:
      context: .
      target: worker
    env_file: .env
    environment: *app-environment
    volumes:
      - audio_data:/srv/eduflow/uploads
      - whisper_cache:/home/eduflow/.cache
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  audio_data:
  whisper_cache:
