name: Backend checks

on:
  pull_request:
    branches: [develop]
  push:
    branches: ['feature/**', 'bugfix/**']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd 'redis-cli ping'
          --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eduflow
          POSTGRES_PASSWORD: ci-only-disposable-password
          POSTGRES_DB: eduflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U eduflow -d eduflow_test'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://eduflow:ci-only-disposable-password@localhost:5432/eduflow_test
      TEST_DATABASE_URL: postgresql+asyncpg://eduflow:ci-only-disposable-password@localhost:5432/eduflow_test
      TEST_REDIS_URL: redis://localhost:6379/15
      JWT_SECRET: ci-only-placeholder-secret-with-at-least-32-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
      - run: alembic downgrade base
      - run: alembic upgrade head
