<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Админ-панель · LectureAI</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/assets/styles.css">
  <script type="module" src="/assets/admin.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/" target="_blank" rel="noopener"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>LectureAI</a>
      <a class="button outline small" id="api-docs" href="/docs" target="_blank" rel="noopener" hidden>Документация API ↗</a>
    </div>
  </header>
  <main class="wrap admin-main">
    <p class="eyebrow">Админ-панель</p>
    <h1>Обработка лекций</h1>
    <p id="admin-notice" class="notice" role="status">Войди в LectureAI и открой админ-панель с главной страницы.</p>
    <section class="panel" id="processing-panel" aria-label="Журнал обработок" hidden>
      <div class="admin-controls">
        <div>
          <label for="result-filter">Результат</label>
          <select id="result-filter">
            <option value="all">Все обработки</option>
            <option value="completed">Успешные</option>
            <option value="failed">Неуспешные</option>
          </select>
        </div>
        <button type="button" class="button outline small" id="refresh-history">Обновить</button>
      </div>
      <p class="muted admin-counts" id="processing-counts"></p>
      <div class="admin-table" tabindex="0" role="region" aria-label="Таблица результатов">
        <table>
          <thead><tr><th scope="col">Лекция</th><th scope="col">Пользователь</th><th scope="col">Результат</th><th scope="col">Время</th><th scope="col">Причина ошибки</th></tr></thead>
          <tbody id="processing-rows"></tbody>
        </table>
      </div>
      <button type="button" class="button outline small" id="more-processing" hidden>Показать ещё</button>
    </section>
  </main>
</body>
</html>
